<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aventuras de rafting no Brasil">
    <title>Rafting Aventura | Home</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>
<body>
    <header>
        <img src="imagens/logo.png" alt="Logo">
        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="imagens/hero.jpg" alt="Rafting">
            <h1>Rafting Aventura Brasil</h1>
        </div>

        <section class="newsletter">
            <h2>Receba Novidades</h2>
            <form>
                <label>Nome: <input type="text" required></label>
                <label>Email: <input type="email" required></label>
                <button type="submit">Inscrever</button>
            </form>
        </section>

        <section class="cta">
            <h2>Pronto pra aventura?</h2>
            <a href="passeios.html" class="botao">Ver Passeios</a>
        </section>

        <section class="grid">
            <div>
                <img src="imagens/rio1.jpg" alt="Rio">
                <h3>Finalidade</h3>
                <p>Aventuras seguras na natureza.</p>
            </div>
            <div>
                <img src="imagens/rio2.jpg" alt="Pessoas">
                <h3>Ofertas</h3>
                <p>Para todos os níveis!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rafting Aventura | Keyla Vidal</p>
    </footer>
</body>
</html>
